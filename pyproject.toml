[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nigeria-data-ingestion-platform"
version = "0.1.0"
description = "Modular data ingestion platform for external Nigerian datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
nigeria-data-ingestion = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "learning_exercises*"]
